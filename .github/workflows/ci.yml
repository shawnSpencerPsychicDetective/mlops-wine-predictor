name: MLOps Build Pipeline

# Trigger: When does this robot run?
# We set it to run on every push to the main branch
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the code from the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Set up Python (just to verify environment)
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Build the Docker Image
    # This is the crucial test. If your Dockerfile is broken, this fails.
    - name: Build Docker Container
      run: docker build -t wine-predictor .
    
    # 5. (Optional) Run a quick test inside the container
    # We briefly start it and check if it crashes immediately
    - name: Dry Run Container
      run: |
        docker run -d --name test-container -p 80:80 wine-predictor
        sleep 5
        docker ps | grep test-container